[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfna"
version = "0.1.0"
description = "Bob-powered Cyber Fraud Network Analyzer: unstructured intel to FIR-ready case brief"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cfna = "cfna.cli:main"

[tool.setuptools.packages.find]
include = ["cfna*"]

[tool.setuptools.package-data]
cfna = ["report/assets/*.css"]
