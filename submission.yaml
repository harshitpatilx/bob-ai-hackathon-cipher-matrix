# =============================================================================
# HACKATHON SUBMISSION METADATA
# =============================================================================
# Instructions:
#   - Fill in ALL required fields (marked with # REQUIRED)
#   - Optional fields can be left as empty strings ""
#   - Do NOT rename this file — the evaluation pipeline reads it by name
#   - Use double quotes around all string values
# =============================================================================

team:
  name: "Cipher Matrix"                             # REQUIRED — e.g., "Orion Squad"
  track: "Cyber Forensics"                            # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "Preetansh Gohil"                           # REQUIRED — e.g., "Alice Chen"
    email: "preetanshmgohil@gmail.com"                          # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: "Jwalan Mantri"                         # REQUIRED — Team member 1
      email: "jwalanmantri2@gmail.com"
    - name: "Harshit Patil"                         # Add more members by copying the two lines above
      email: "mailme.harshitp@gmail.com"
    - name: "Vaibhav Tailor"
      email: "vaibhavtailor2008@gmail.com"

submission:
  title: "Cyber Fraud Network Analyzer"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Replace this text with a concise description of the real-world problem
    your project addresses and who experiences it.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Replace this text with a clear description of your solution
    and how it addresses the problem above.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Multi-Source Intelligence Extraction"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Automated Relationship Discovery"
    - "Interactive Fraud Network Graph"
    - "Fraud Pattern & Role Detection"                               # optional 4th
    - "FIR-Ready Investigation Brief"                               # optional 5th

  tech_stack:
    languages: ["Python", "Javascript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["stdlib", "vis.js"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBMBob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

# =============================================================================
# ARTIFACT LOCATIONS
# These paths are relative to the repo root. Only change if you moved files.
# =============================================================================
artifacts:
  source_code: "src/"
  setup_guide: "docs/setup-guide.md"
  architecture_doc: "docs/architecture.md"
  demo_video: "demo/demo-video-link.txt"   # URL to hosted video (YouTube, Loom, Box)
  live_demo: "demo/live-demo-url.txt"      # URL to deployed demo (optional)
  screenshots: "demo/screenshots/"
  presentation: "presentation/"